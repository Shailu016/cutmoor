version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine updates; majors stay separate so they get a real review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The ffmpeg core is pinned by version and fingerprint in the workflows and the CDN URL.
      # Upgrade it by hand: update the URL in ci.yml and deploy.yml, then re-run scripts/verify.
      - dependency-name: "@ffmpeg/core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
