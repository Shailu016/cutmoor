name: CI

# Every pull request goes through the release gates (gates.yml): typecheck,
# tests, the production build, the performance budget, accessibility,
# Lighthouse, and layout stability on desktop, a short laptop screen and a
# phone. Pull requests from this repository then get a preview site of the
# exact build that passed. Merging to master deploys through deploy.yml, which
# runs the same gates again.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  preview:
    needs: gates
    # Forks cannot read the secret, and a preview of someone else's code should not use it.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Previews must never be indexed.
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
          dist_dir="$PWD/dist"
          # Run from an empty directory: Wrangler 4 otherwise auto-configures the repo as a Worker project.
          cd "$RUNNER_TEMP"
          npx --yes wrangler@4.161.0 pages deploy "$dist_dir" \
            --project-name cutmoor \
            --branch "pr-${PR_NUMBER}" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Preview of PR #${PR_NUMBER}" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*\.pages\.dev' deploy.log | tail -1)
          echo "Preview: $url"
          echo "### Preview site" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $url
          Built from \`${GITHUB_SHA::7}\`. Previews are not indexed by search engines."
